variables:
  # This variables can be overwrite by the one defined in the "caller" yaml
  GIT_SERVER_HOST: "https://$CI_SERVER_HOST/"
  ARTIFACTS_LOCATION: "${CI_PROJECT_DIR}/artifacts"
  AxisDevBranch: master
  ProjAdminBranch: master
  WORKSPACE: /home/user/Projects
  BUILD_IMAGE: "False" # controls projectman "--noimage" flag
  UNITTEST_DIR: "${CI_PROJECT_DIR}/ci-unittest"
  ACTIVITY: 4
  PMAN_SCRIPTS_DIR: /opt/axis/axidev_update
  CACHE_LOCATION: "$CI_PROJECT_DIR/.cache" # used in installToolchain.sh for C++99!
  POLARIS_TOOL_VERSION: 2026.6.0
  COVERITY_TOOL_VERSION: 2025.12.2
  HOSTS_ENTRIES: |
    10.135.0.17 svn.axis.annax.ch

.projman_setup:
  script:
    # setup hosts entries
    - echo -e "$HOSTS_ENTRIES" | sudo tee -a /etc/hosts
    # setup global git ignores and token config
    - sudo git config --system "url.https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_HOST.insteadof" "https://$CI_SERVER_HOST"
    - sudo git config --system core.excludesfile /etc/gitignore
    - |
      cat <<EOF | sudo tee /etc/gitignore
      /.cache
      /artifacts
      /ci-unittest
      EOF
    # create cache directory if missing
    - sudo mkdir --mode=777 -p "$CACHE_LOCATION"
    # create build dir for host tools
    - sudo mkdir -p /srv/lnx64/rootfs-user
    - sudo chown -R "$(id -u):$(id -g)" "$HOME" /srv/lnx64/rootfs-user
    - rm -rf "${PMAN_SCRIPTS_DIR}"
    - mkdir -p "${PMAN_SCRIPTS_DIR}"
    - git clone -c advice.detachedHead=false --filter=blob:none --branch=${AxisDevBranch} ${GIT_SERVER_HOST}annax/pis/ofris/tools/AxisDev/AxisDev.git "${PMAN_SCRIPTS_DIR}"
    - |
      (
        set -ex
        . /etc/axis/axisconfig # provides AX_AXISPROJDIR
        rm -rf "${AX_AXISPROJDIR:?}"
        mkdir -p "${AX_AXISPROJDIR:?}"
        git clone -c advice.detachedHead=false --filter=blob:none --branch="${PMAN_CI_SCRIPTS_PROJLIST_VERSION:-$ProjAdminBranch}" "${GIT_SERVER_HOST}annax/pis/ofris/tools/AxisDev/ProjAdmin.git" "${AX_AXISPROJDIR:?}"
      )
      export CONFIG_FILE="${PMAN_CI_CONFIG_FILE:-"${CONFIG_FILE:-ReleaseConfig.txt}"}"
      export TARGET_DEVICE="${PMAN_CI_PROJECT_PROJECT_TYPE:-${TARGET_DEVICE}}"
      export BUILD_MODE="${PMAN_CI_PROJECT_PROJECT_BUILD:-${BUILD_MODE}}"
    - |
      if [ -n "$PMAN_CI_ROOTFS_USER" ]; then
        sudo mkdir -p "$PMAN_CI_ROOTFS_USER"
        sudo chown "$(id -u):$(id -g)" "$PMAN_CI_ROOTFS_USER"
      fi

.projman_dotenv_report:
  tags:
    - latest
  image:
    name: "${CI_REGISTRY}/annax/pis/devops_group/cicd/docker/axis/builder:latest"
    entrypoint: [""]
  artifacts:
    reports:
      dotenv: "$CACHE_LOCATION/releaseconfig.env"
  script:
    # setup projectman master from git
    - !reference [.projman_setup, script]

    # convert releaseconfig to dotenv file
    - mkdir -p "$CACHE_LOCATION"
    - ${PMAN_SCRIPTS_DIR}/project/projectman.sh subcommand iniq "build/${CONFIG_FILE:-ReleaseConfig.txt}" 'env:PMAN_CI_' > $CACHE_LOCATION/releaseconfig.env

    # add path to PMAN_CI_PROJECT_DIR based on releaseconfig
    - export PMAN_CI_PROJECT_DIR="$(${PMAN_SCRIPTS_DIR}/project/projectman.sh subcommand project_dir_from_releaseconfig "${WORKSPACE:?}" "build/${CONFIG_FILE:-ReleaseConfig.txt}" "${ACTIVITY:?}")"

    # load the generated env file
    # since it may have spaces, escape them. gitlab cannot have quotes.
    # https://gist.github.com/mihow/9c7f559807069a03e302605691f85572?permalink_comment_id=3625310#gistcomment-3625310
    - set -ax
    - source <(cat "$CACHE_LOCATION/releaseconfig.env" | sed -e '/^#/d;/^\s*$/d' -e "s/'/'\\\''/g" -e "s/=\(.*\)/='\1'/g")

    # check that we have a build target
    - |
      if [ -z "${PMAN_CI_PROJECT_PROJECT_TYPE}" ]; then
          echo "PROJECT.PROJECT_TYPE is unset in ReleaseConfig.txt" 1>&2
          echo "Exit with error!" 1>&2
          exit 1
      fi

    # add ci docker images based on settings in releaseconfig to the env file
    - |
      case "${PMAN_CI_BUILD_CONTAINER_BUILD_IMAGE_VERSION}" in
        "" )
          echo "BUILD_CONTAINER.BUILD_IMAGE_VERSION is unset in ReleaseConfig.txt" 1>&2
          echo "Falling back to legacy CPP-98 build" 1>&2
          PMAN_CI_MODE=CPP-98
          case "${PMAN_CI_PROJECT_PROJECT_TYPE}" in
            REC2)
              PMAN_CI_BUILD_IMAGE="${CI_REGISTRY}/annax/pis/devops_group/cicd/docker/axis/builder-rec2:latest"
              PMAN_CI_UNITTEST_IMAGE="registry-gitlab.corp.wabtec.com/annax/pis/devops_group/cicd/docker/rec2/rec2-img:01.00.70"
            ;;
            *)
              PMAN_CI_BUILD_IMAGE="${CI_REGISTRY}/annax/pis/devops_group/cicd/docker/axis/builder:latest"
            ;;
          esac
        ;;
        *)
          PMAN_CI_MODE=CPP-17
          PMAN_CI_BUILD_IMAGE="$CI_REGISTRY/annax/pis/artifacts/cicd/${PMAN_CI_PROJECT_PROJECT_TYPE,,}:${PMAN_CI_BUILD_CONTAINER_BUILD_IMAGE_VERSION}"
          PMAN_CI_UNITTEST_IMAGE="$CI_REGISTRY/annax/pis/artifacts/rfs/${PMAN_CI_PROJECT_PROJECT_TYPE,,}:${PMAN_CI_BUILD_CONTAINER_BUILD_IMAGE_VERSION}"
          ;;
      esac
    - |
      cat <<EOF | tee -a "$CACHE_LOCATION/releaseconfig.env"
      PMAN_CI_MODE=$PMAN_CI_MODE
      PMAN_CI_BUILD_IMAGE=$PMAN_CI_BUILD_IMAGE
      PMAN_CI_UNITTEST_IMAGE=$PMAN_CI_UNITTEST_IMAGE
      PMAN_CI_ROOTFS_USER=/srv/${PMAN_CI_PROJECT_PROJECT_TYPE,,}/rootfs-user/
      PMAN_CI_PROJECT_DIR=$PMAN_CI_PROJECT_DIR
      PMAN_CI_CONFIG_FILE=$CONFIG_FILE
      EOF
    - set +ax

.projman_transfer_image:
  needs:
    - job: projman_dotenv_report
  tags:
    - latest
  image: $CI_REGISTRY/annax/ads/containers/buildah:stable
  before_script:
    - skopeo --version
    - "if [ -z $PMAN_CI_BUILD_IMAGE_JFROG ]; then exit 0;fi;"
    - skopeo login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - skopeo login -u "${WT_ARTIFACTORY_AUTH%:*}" -p "${WT_ARTIFACTORY_AUTH#*:}" "jfrog.de.corp.wabtec.com"
  script:
    - "if [ -z $PMAN_CI_BUILD_IMAGE_JFROG ]; then exit 0;fi;"
    - 'echo "Transferring Container image: $PMAN_CI_BUILD_IMAGE_JFROG to $PMAN_CI_BUILD_IMAGE"'
    - skopeo copy --format v2s2 "docker://$PMAN_CI_BUILD_IMAGE_JFROG" "docker://$PMAN_CI_BUILD_IMAGE"

.projman_build:
  cache:
    paths:
      - $CACHE_LOCATION
  tags:
    - latest
  image:
    # name: "${CI_REGISTRY}/annax/pis/devops_group/cicd/docker/atom/cpp17:02.00.00"
    # "${CI_REGISTRY}/annax/pis/devops_group/cicd/docker/atom/cpp17:02.00.00@sha256:a7a0ff4cf46015f21b452e5bdf013d168189a3481066bde69b14e123bb16cbf4"
    name: "$PMAN_CI_BUILD_IMAGE"
  script:
    - set -x
    - !reference [.projman_setup, script]
    - bash "${PMAN_SCRIPTS_DIR}/project/docker/entrypoint.sh"
    - bash "${PMAN_SCRIPTS_DIR}/project/docker/archive_artifacts.sh"
    - ls -alsh "${PMAN_CI_PROJECT_DIR:?}"
    - |
      if [ -n "$UNITTEST_FILE" ]; then
        mkdir -p "$UNITTEST_DIR"
        find "${PMAN_CI_PROJECT_DIR:?}" -type f -name "$UNITTEST_FILE" -print -exec \
          install -m 777  '{}' "${UNITTEST_DIR}/$UNITTEST_FILE" ';'
      fi
  artifacts:
    paths:
      - ${ARTIFACTS_LOCATION}/
      - ${UNITTEST_DIR}/
    expire_in: 2 week

.upload_artifacts_to_artifactory:
  variables:
    ARTIFACTORY_HOST: jfrog.de.corp.wabtec.com
    ARTIFACTORY_REPO: pis-generic-local
    ARTIFACTS_LOCATION: "${CI_PROJECT_DIR}/artifacts"
    ARTIFACTS_ARCHIVE: "true"
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf:2.119.0
  tags:
    - latest
  # needs:
  #   - .projman_build # this needs to be set to the project build job
  script:
    - jf -v
    - jf c add --user="${WT_ARTIFACTORY_AUTH%:*}" --password="${WT_ARTIFACTORY_AUTH#*:}" --url=https://$ARTIFACTORY_HOST
    - cd "${ARTIFACTS_LOCATION}"
    - |
      if $ARTIFACTS_ARCHIVE; then
        ARCHIVE_BASENAME=artifacts.zip
        ARCHIVE_JF_ARG="--archive zip"
      else
        ARCHIVE_BASENAME=""
        ARCHIVE_JF_ARG=""
      fi
    - jf rt u $ARCHIVE_JF_ARG --flat=false --recursive --symlinks ./ "$ARTIFACTORY_REPO/$CI_PROJECT_PATH/$CI_COMMIT_REF_NAME/$ARCHIVE_BASENAME"

.polaris_scan:
  tags:
    - latest
  variables:
    POLARIS_SERVER_URL: "https://wabtec.cop.blackduck.com"
  image:
    name: "$PMAN_CI_BUILD_IMAGE"
    entrypoint: [""]
  script:
    - set -x
    - !reference [.projman_setup, script]
    - bash "${PMAN_SCRIPTS_DIR}/project/docker/polaris_entrypoint.sh"

.gtest-unittests:
  tags:
    - latest
  # # Jobs using this template need to define UNITTEST_FILE
  # variables:
  #   UNITTEST_FILE: ""
  image:
    name: "$PMAN_CI_UNITTEST_IMAGE"
    entrypoint: [""]
  script:
    # workaround for: https://gitlab.corp.wabtec.com/annax/pis/ofris/framework/Ofris3/-/jobs/26387124
    # C++17 buildcontainer does not come with /tmp
    # but some tests depend on creating files inside /tmp for now
    - mkdir -p /tmp

    # Fixing permissions before the main script runs
    - |
      if [ -d /var/annax ]; then
        sudo chmod -R 755 "/var/annax"
      fi
    - |
      if [ -d "${UNITTEST_DIR}" ]; then
        sudo chmod -R 755 "${UNITTEST_DIR}"
      fi
    - chmod +x "${UNITTEST_DIR:?}/${UNITTEST_FILE:?}"
    - export "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${UNITTEST_DIR}"
    - cd "$UNITTEST_DIR"
    - ./${UNITTEST_FILE:?} --gtest_output=xml:"${UNITTEST_DIR}/${UNITTEST_FILE}_report.xml"
  artifacts:
    when: always
    expire_in: "12 months"
    paths:
      - "${UNITTEST_DIR}/${UNITTEST_FILE}_report.xml"
    reports:
      junit:
        - "${UNITTEST_DIR}/${UNITTEST_FILE}_report.xml"

